<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Tracker Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.5;
            padding-bottom: 40px;
        }
        .container { max-width: 900px; margin: 0 auto; padding: 20px; }
        h1 { font-size: 1.5rem; margin-bottom: 4px; color: #f0f6fc; }
        .subtitle { color: #8b949e; font-size: 0.85rem; margin-bottom: 20px; }

        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 16px;
            border-bottom: 1px solid #30363d;
            padding-bottom: 0;
        }
        .tab {
            padding: 10px 20px;
            cursor: pointer;
            border: none;
            background: none;
            color: #8b949e;
            font-size: 0.9rem;
            font-weight: 500;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            transition: all 0.2s;
        }
        .tab:hover { color: #c9d1d9; }
        .tab.active {
            color: #58a6ff;
            border-bottom-color: #58a6ff;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .card h2 { font-size: 0.8rem; text-transform: uppercase; color: #8b949e; margin-bottom: 8px; letter-spacing: 0.5px; }
        .big-number { font-size: 2rem; font-weight: 700; color: #f0f6fc; }
        .unit { font-size: 0.9rem; color: #8b949e; font-weight: 400; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        @media (max-width: 500px) { .grid-3 { grid-template-columns: 1fr; } }

        .progress-wrap { margin-top: 10px; }
        .progress-bar-bg {
            background: #21262d;
            border-radius: 8px;
            height: 28px;
            overflow: hidden;
            position: relative;
        }
        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #238636, #2ea043);
            border-radius: 8px;
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 10px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #fff;
            min-width: 40px;
        }
        .progress-bar-fill.warning { background: linear-gradient(90deg, #d29922, #daaa3f); }
        .progress-bar-fill.danger { background: linear-gradient(90deg, #da3633, #f85149); }
        .progress-labels { display: flex; justify-content: space-between; margin-top: 4px; font-size: 0.75rem; color: #8b949e; }

        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th, td { padding: 10px 8px; text-align: left; border-bottom: 1px solid #21262d; }
        th { color: #8b949e; font-weight: 500; font-size: 0.75rem; text-transform: uppercase; cursor: pointer; user-select: none; }
        th:hover { color: #c9d1d9; }
        td { color: #c9d1d9; }
        tr:hover td { background: #161b22; }
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 500;
        }
        .badge-cardio { background: #1f4d2e; color: #3fb950; }
        .badge-strength { background: #3d1f4d; color: #d2a8ff; }

        .chart-wrap { position: relative; height: 220px; margin-top: 10px; }

        .search-box {
            width: 100%;
            padding: 10px 14px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            color: #c9d1d9;
            font-size: 0.9rem;
            margin-bottom: 12px;
        }
        .search-box:focus { outline: none; border-color: #58a6ff; }

        .refresh-note {
            text-align: center;
            color: #484f58;
            font-size: 0.75rem;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💪 Gym Tracker</h1>
        <div class="subtitle" id="date-label">Loading...</div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('dashboard')">Dashboard</button>
            <button class="tab" onclick="switchTab('database')">Database</button>
        </div>

        <!-- Dashboard Tab -->
        <div id="dashboard" class="tab-content active">
            <div class="card">
                <h2>Today's Progress</h2>
                <div class="grid-3">
                    <div><div class="big-number"><span id="today-cal">0</span> <span class="unit">kcal</span></div></div>
                    <div><div class="big-number"><span id="today-min">0</span> <span class="unit">min</span></div></div>
                    <div><div class="big-number"><span id="today-count">0</span> <span class="unit">workouts</span></div></div>
                </div>
                <div class="progress-wrap">
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill" id="progress-fill" style="width: 0%">0%</div>
                    </div>
                    <div class="progress-labels">
                        <span>0</span>
                        <span id="goal-label">Goal: 1000 kcal</span>
                    </div>
                </div>
            </div>

            <div class="card">
                <h2>7-Day Average</h2>
                <div class="grid-3">
                    <div><div class="big-number"><span id="avg-cal">0</span> <span class="unit">kcal/day</span></div></div>
                    <div><div class="big-number"><span id="avg-min">0</span> <span class="unit">min/day</span></div></div>
                    <div><div class="big-number"><span id="days-logged">0</span> <span class="unit">days</span></div></div>
                </div>
                <div class="chart-wrap"><canvas id="weekChart"></canvas></div>
            </div>

            <div class="card">
                <h2>Recent Workouts</h2>
                <div style="overflow-x: auto;">
                    <table>
                        <thead><tr><th>Date</th><th>Machine</th><th>Type</th><th>Min</th><th>Kcal</th></tr></thead>
                        <tbody id="workout-table"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Database Tab -->
        <div id="database" class="tab-content">
            <div class="card">
                <h2>Full Workout Database <span id="db-count" style="color:#8b949e; font-weight:400;"></span></h2>
                <input type="text" class="search-box" id="db-search" placeholder="Search machine, date, notes..." oninput="filterDB()">
                <div style="overflow-x: auto;">
                    <table>
                        <thead>
                            <tr>
                                <th onclick="sortDB('date')">Date ↕</th>
                                <th onclick="sortDB('machine')">Machine ↕</th>
                                <th onclick="sortDB('type')">Type ↕</th>
                                <th onclick="sortDB('duration_min')">Min ↕</th>
                                <th onclick="sortDB('calories')">Kcal ↕</th>
                                <th>Level</th>
                                <th>Notes</th>
                            </tr>
                        </thead>
                        <tbody id="db-table"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="refresh-note">Auto-refreshes every 60s · <a href="/" style="color:#58a6ff">Reload now</a></div>
    </div>

    <script>
        let allWorkouts = [];
        let weekChartInstance = null;
        const DAILY_GOAL = 1000;
        let dbSortKey = 'date';
        let dbSortAsc = false;

        function switchTab(name) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(name).classList.add('active');
        }

        function sortDB(key) {
            if (dbSortKey === key) dbSortAsc = !dbSortAsc;
            else { dbSortKey = key; dbSortAsc = true; }
            renderDB();
        }

        function filterDB() {
            renderDB();
        }

        function renderDB() {
            const q = document.getElementById('db-search').value.toLowerCase();
            let rows = allWorkouts.filter(w => {
                return (w.date || '').toLowerCase().includes(q) ||
                       (w.machine || '').toLowerCase().includes(q) ||
                       (w.type || '').toLowerCase().includes(q) ||
                       (w.notes || '').toLowerCase().includes(q) ||
                       (w.level || '').toLowerCase().includes(q);
            });
            rows.sort((a, b) => {
                let av = a[dbSortKey], bv = b[dbSortKey];
                if (typeof av === 'string') av = av.toLowerCase();
                if (typeof bv === 'string') bv = bv.toLowerCase();
                if (av < bv) return dbSortAsc ? -1 : 1;
                if (av > bv) return dbSortAsc ? 1 : -1;
                return 0;
            });
            document.getElementById('db-count').textContent = `(${rows.length} rows)`;
            document.getElementById('db-table').innerHTML = rows.map(w => {
                const typeClass = w.type === 'Strength' ? 'badge-strength' : 'badge-cardio';
                return `<tr>
                    <td>${w.date}</td>
                    <td>${w.machine}</td>
                    <td><span class="badge ${typeClass}">${w.type}</span></td>
                    <td>${w.duration_min}</td>
                    <td><strong>${w.calories}</strong></td>
                    <td>${w.level || ''}</td>
                    <td style="max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" title="${w.notes || ''}">${w.notes || ''}</td>
                </tr>`;
            }).join('');
        }

        async function load() {
            const res = await fetch('data/workouts.json?t=' + Date.now());
            const data = await res.json();
            allWorkouts = data.workouts || [];
            const todayStr = new Date().toISOString().slice(0, 10);

            const todayWorkouts = allWorkouts.filter(w => w.date === todayStr);
            const totalCal = todayWorkouts.reduce((s, w) => s + (w.calories || 0), 0);
            const totalMin = todayWorkouts.reduce((s, w) => s + (w.duration_min || 0), 0);
            const pct = Math.min(100, Math.round((totalCal / DAILY_GOAL) * 100));

            document.getElementById('date-label').textContent = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
            document.getElementById('today-cal').textContent = totalCal.toFixed(1);
            document.getElementById('today-min').textContent = totalMin.toFixed(1);
            document.getElementById('today-count').textContent = todayWorkouts.length;
            document.getElementById('goal-label').textContent = 'Goal: ' + DAILY_GOAL + ' kcal';

            const fill = document.getElementById('progress-fill');
            fill.style.width = pct + '%';
            fill.textContent = pct + '%';
            fill.className = 'progress-bar-fill';
            if (pct < 50) fill.classList.add('danger');
            else if (pct < 80) fill.classList.add('warning');

            // 7-day
            const days = {};
            for (let i = 6; i >= 0; i--) {
                const d = new Date(); d.setDate(d.getDate() - i);
                days[d.toISOString().slice(0, 10)] = { cal: 0, mins: 0 };
            }
            allWorkouts.forEach(w => {
                if (days[w.date]) {
                    days[w.date].cal += w.calories || 0;
                    days[w.date].mins += w.duration_min || 0;
                }
            });
            const dayEntries = Object.entries(days);
            const avgCal = (dayEntries.reduce((s, [, v]) => s + v.cal, 0) / 7).toFixed(1);
            const avgMin = (dayEntries.reduce((s, [, v]) => s + v.mins, 0) / 7).toFixed(1);
            const daysLogged = dayEntries.filter(([, v]) => v.cal > 0).length;

            document.getElementById('avg-cal').textContent = avgCal;
            document.getElementById('avg-min').textContent = avgMin;
            document.getElementById('days-logged').textContent = daysLogged;

            // Chart
            const labels = dayEntries.map(([d]) => d.slice(5));
            const dataCal = dayEntries.map(([, v]) => v.cal);
            const ctx = document.getElementById('weekChart').getContext('2d');
            if (weekChartInstance) weekChartInstance.destroy();
            weekChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Calories',
                        data: dataCal,
                        backgroundColor: '#238636',
                        borderRadius: 4,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true, grid: { color: '#21262d' }, ticks: { color: '#8b949e', font: { size: 11 } } },
                        x: { grid: { display: false }, ticks: { color: '#8b949e', font: { size: 11 } } }
                    }
                }
            });

            // Recent table
            document.getElementById('workout-table').innerHTML = allWorkouts.slice(0, 15).map(w => {
                const typeClass = w.type === 'Strength' ? 'badge-strength' : 'badge-cardio';
                return `<tr><td>${w.date}</td><td>${w.machine}</td><td><span class="badge ${typeClass}">${w.type}</span></td><td>${w.duration_min}</td><td><strong>${w.calories}</strong></td></tr>`;
            }).join('');

            // Database tab
            renderDB();
        }

        load();
        setInterval(load, 60000);
    </script>
</body>
</html>
